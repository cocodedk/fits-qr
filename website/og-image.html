<!doctype html>
<!-- Source for og.png. Render with:
     chromium --headless --screenshot=website/og.png --window-size=1200,630 \
       --hide-scrollbars website/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FITS QR — OG image source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@700;800&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; align-items: center; gap: 64px;
    padding: 0 78px;
    background:
      radial-gradient(760px 520px at 92% 10%, rgba(88,110,255,0.34), transparent 66%),
      radial-gradient(620px 460px at 4% 80%, rgba(0,178,184,0.22), transparent 68%),
      linear-gradient(158deg, #0b1524 0%, #13233e 50%, #0a1a5c 100%);
    font-family: Inter, system-ui, sans-serif;
    color: #fff;
    position: relative;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(circle at 40% 45%, #000 40%, transparent 76%);
  }
  .copy { position: relative; z-index: 1; flex: 1; min-width: 0; }
  .logo { width: 210px; display: block; }
  h1 {
    font-family: "Inter Tight", Inter, sans-serif;
    font-size: 65px; font-weight: 800; line-height: 0.98;
    letter-spacing: -0.036em;
    margin-top: 26px;
  }
  h1 em { font-style: normal; color: #7feaef; }
  p.sub {
    font-size: 22px; font-weight: 500; line-height: 1.42;
    color: rgba(255,255,255,0.66);
    margin-top: 20px; max-width: 25ch;
  }
  .chips { display: flex; gap: 10px; margin-top: 30px; }
  .chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    padding: 8px 15px; border-radius: 999px;
    border: 1px solid rgba(0,178,184,0.45);
    background: rgba(0,178,184,0.11);
    color: #7feaef; white-space: nowrap;
  }
  /* the phone, cropped by the frame edge so it reads as a real device */
  .phone {
    position: relative; z-index: 1;
    flex: none; width: 336px; height: 700px;
    margin-bottom: -150px;
    border-radius: 44px; padding: 10px;
    background: linear-gradient(160deg, #2b3752, #0d1728 60%);
    box-shadow: 0 40px 90px rgba(0,0,0,0.6);
  }
  .screen {
    width: 100%; height: 100%; border-radius: 35px; overflow: hidden;
    background: linear-gradient(168deg, #0b1524 0%, #13233e 42%, #0818a0 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 20px 0;
  }
  .screen img.mark { width: 116px; display: block; }
  .pill {
    margin-top: 9px; padding: 5px 13px;
    border: 1px solid rgba(0,178,184,0.45); border-radius: 999px;
    background: rgba(0,178,184,0.10);
    font-size: 11px; font-weight: 600; color: #7feaef; white-space: nowrap;
  }
  .qr-holder { position: relative; margin-top: 22px; }
  .qr-holder::before {
    content: ""; position: absolute; inset: -26px; border-radius: 44px;
    background: radial-gradient(circle, rgba(0,178,184,0.6) 0%, rgba(0,178,184,0) 68%);
    filter: blur(20px);
  }
  .qr {
    position: relative; width: 268px; height: 268px;
    padding: 13px; border-radius: 24px; background: #fff;
    box-shadow: 0 22px 54px rgba(0,0,0,0.45);
  }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .who {
    margin-top: 20px; width: 100%;
    border-radius: 16px; background: rgba(11,21,36,0.66);
    border: 1px solid rgba(255,255,255,0.10);
    padding: 12px 15px;
  }
  .who b { display: block; font-size: 15px; font-weight: 600; }
  .who span { font-size: 11px; font-weight: 500; color: rgba(127,234,239,0.78); }
  .dots { display: flex; gap: 7px; margin-top: 16px; }
  .dots i { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.25); }
  .dots i:first-child { width: 20px; background: #00b2b8; }
</style>
</head>
<body>
  <div class="copy">
    <img class="logo" src="fits-logo-white.png" alt="FITS">
    <h1>Three contacts.<br><em>One scan each.</em></h1>
    <p class="sub">The FITS contact app for Android. Open source, offline, no permissions.</p>
    <div class="chips">
      <span class="chip">vCard 3.0</span>
      <span class="chip">Apache-2.0</span>
      <span class="chip">Android 8+</span>
    </div>
  </div>

  <div class="phone">
    <div class="screen">
      <img class="mark" src="fits-logo-white.png" alt="">
      <div class="pill">AI-Powered Policy Automation</div>
      <div class="qr-holder">
        <div class="qr"><img src="qr-bassil.png" alt=""></div>
      </div>
      <div class="who"><b>Bassil Salameh</b><span>CEO</span></div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </div>
</body>
</html>
