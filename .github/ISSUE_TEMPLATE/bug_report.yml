name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / emulator
    validations:
      required: false
  - type: input
    id: android-version
    attributes:
      label: Android version
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version
    validations:
      required: false
