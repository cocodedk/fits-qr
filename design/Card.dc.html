<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #00B2B8; text-decoration: none; }
    a:hover { color: #5BE0E6; }
    @keyframes fits-pulse {
      0%, 100% { transform: scale(1.06); opacity: 0.5; }
      50% { transform: scale(1.16); opacity: 0.8; }
    }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(168deg, #0B1524 0%, #13233E 42%, #0818A0 100%);">

  <div style="position: absolute; top: -120px; left: -140px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(0,178,184,0.20) 0%, rgba(0,178,184,0) 70%);"></div>
  <div style="position: absolute; bottom: -160px; right: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(88,110,255,0.28) 0%, rgba(88,110,255,0) 70%);"></div>
  <div style="position: absolute; inset: 0; opacity: 0.5; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 26px 26px;"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; height: 100%; box-sizing: border-box; padding: 44px 24px 18px;">

    <img src="fits-logo-white.png" alt="FITS" style="width: 126px; height: auto; display: block;">
    <div style="margin-top: 9px; padding: 5px 14px; border: 1px solid rgba(0,178,184,0.45); border-radius: 999px; background: rgba(0,178,184,0.10); font-size: 12px; font-weight: 600; color: #7FEAEF;">AI-Powered Policy Automation</div>

    <div style="position: relative; margin-top: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="position: absolute; inset: 0; border-radius: 40px; background: radial-gradient(circle, rgba(0,178,184,0.55) 0%, rgba(0,178,184,0) 68%); filter: blur(20px); animation: fits-pulse 4.5s ease-in-out infinite;"></div>
      <div style="position: relative; padding: 14px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 24px 60px rgba(0,0,0,0.45);">
        <sc-if value="{{isBassil}}" hint-placeholder-val="{{true}}">
          <img src="qr-bassil.png" alt="QR code with Bassil Salameh's contact details" style="display: block; width: 268px; height: 268px; image-rendering: pixelated;">
        </sc-if>
        <sc-if value="{{isBabak}}" hint-placeholder-val="{{false}}">
          <img src="qr-babak.png" alt="QR code with Babak Bandpey's contact details" style="display: block; width: 268px; height: 268px; image-rendering: pixelated;">
        </sc-if>
        <sc-if value="{{isSilas}}" hint-placeholder-val="{{false}}">
          <img src="qr-silas.png" alt="QR code with Silas Stilling Jørgensen's contact details" style="display: block; width: 268px; height: 268px; image-rendering: pixelated;">
        </sc-if>
      </div>
    </div>

    <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="14" stroke="#7FEAEF" stroke-width="1.5"/>
        <path d="M7 9.5V7.5h2M17 9.5V7.5h-2M7 14.5v2h2M17 14.5v2h-2" stroke="#7FEAEF" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.86);">Scan to save the contact</div>
    </div>

    <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 1px; border-radius: 20px; overflow: hidden; background: rgba(255,255,255,0.10);">

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: rgba(11,21,36,0.62);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.6" stroke="#00B2B8" stroke-width="1.6"/>
          <path d="M4.8 20c0-3.6 3.2-5.6 7.2-5.6s7.2 2 7.2 5.6" stroke="#00B2B8" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 600; color: #FFFFFF;">{{name}}</div>
          <div style="font-size: 11px; font-weight: 500; color: rgba(127,234,239,0.75);">{{role}}</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: rgba(11,21,36,0.62);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke="#00B2B8" stroke-width="1.6"/>
          <path d="M3.5 7l8.5 6 8.5-6" stroke="#00B2B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="font-size: 14px; font-weight: 500; color: #FFFFFF;">{{email}}</div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: rgba(11,21,36,0.62);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.2 3.5h3l1.6 4-2 1.4a11.4 11.4 0 0 0 5.3 5.3l1.4-2 4 1.6v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.2 5.7a2 2 0 0 1 2-2.2Z" stroke="#00B2B8" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <div style="font-size: 14px; font-weight: 500; color: #FFFFFF;">{{phone}}</div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: rgba(11,21,36,0.62);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 21c4-4.2 6-7.3 6-10a6 6 0 1 0-12 0c0 2.7 2 5.8 6 10Z" stroke="#00B2B8" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="10.6" r="2.2" stroke="#00B2B8" stroke-width="1.6"/>
        </svg>
        <div style="font-size: 14px; font-weight: 500; color: #FFFFFF;">Københavnsvej 19B, 4000 Roskilde</div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 12px 18px; background: rgba(9,26,38,0.78);">
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #7FEAEF;">fits.dk</div>
        <div style="width: 4px; height: 4px; border-radius: 50%; background: rgba(127,234,239,0.5);"></div>
        <div style="font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.55);">Danish product · European hosting</div>
      </div>

    </div>

    <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px;">
      <sc-for list="{{dots}}" as="dot" hint-placeholder-count="3">
        <div style="width: {{dot.w}}; height: 7px; border-radius: 999px; background: {{dot.color}};"></div>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"person":{"editor":"enum","options":["bassil","babak","silas"],"default":"bassil"},"$preview":{"width":390,"height":844}}'>
const PEOPLE = {
  bassil: { name: 'Bassil Salameh', role: 'CEO', email: 'fits@l7consulting.dk', phone: '+45 22 547 547', index: 0 },
  babak: { name: 'Babak Bandpey', role: 'CTO', email: 'bba@l7consulting.dk', phone: '+45 27 82 30 77', index: 1 },
  silas: { name: 'Silas Stilling Jørgensen', role: 'Cybersecurity Developer', email: 'ssj@l7consulting.dk', phone: '+45 61 26 89 99', index: 2 },
};

class Component extends DCLogic {
  renderVals() {
    const key = PEOPLE[this.props.person] ? this.props.person : 'bassil';
    const p = PEOPLE[key];
    return {
      name: p.name,
      role: p.role,
      email: p.email,
      phone: p.phone,
      isBassil: key === 'bassil',
      isBabak: key === 'babak',
      isSilas: key === 'silas',
      dots: [0, 1, 2].map((i) => ({
        w: i === p.index ? '22px' : '7px',
        color: i === p.index ? '#00B2B8' : 'rgba(255,255,255,0.25)',
      })),
    };
  }
}
</script>
</body>
</html>
